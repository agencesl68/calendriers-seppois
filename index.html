<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tournée des Calendriers</title>
<meta name="description" content="Vente des calendriers de l'Amicale des Sapeurs-Pompiers de Seppois-le-Bas : Seppois-le-Bas, Largitzen, Mooslargue, Pfetterhouse, Ueberstrass.">
<meta name="theme-color" content="#15171A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Calendriers">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Big+Shoulders+Display:wght@600;700;800;900&display=swap">
<link rel="stylesheet" href="vendor/leaflet.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <header class="top">
    <button class="crest" data-act="go" data-v="home" aria-label="Accueil"><img src="icons/logo.jpg" alt="Blason de l'Amicale des Sapeurs-Pompiers de Seppois-le-Bas" width="44" height="44"></button>
    <div class="top-t">
      <div class="top-eyebrow">Amicale des Sapeurs-Pompiers · Seppois-le-Bas</div>
      <h1 id="hdr-title">Calendriers 2027</h1>
    </div>
    <button id="sync-pill" class="sync-pill" data-act="page" data-v="settings" data-sec="sync"><i></i><span>Local</span></button>
    <button id="me-btn" class="me-btn" data-act="me-sheet" aria-label="Qui fait la tournée ?"></button>
    <button class="icon-btn" data-act="page" data-v="settings" aria-label="Réglages"><svg class="ico" aria-hidden="true"><use href="#i-gear"></use></svg></button>
  </header>
  <div class="hivis" aria-hidden="true"></div>
  <div id="demo-banner" class="demo-banner" hidden><b>Mode démo</b><span>Données fictives, rien n'est enregistré.</span><button data-act="demo-exit">Quitter la démo</button></div>

  <main id="main">
    <section id="v-home" class="view" aria-label="Tableau de bord"></section>
    <section id="v-map" class="view map-wrap" aria-label="Carte et rues" hidden>
      <div class="map-bar">
        <div class="seg" role="tablist">
          <button data-act="mapmode" data-v="map" role="tab">Carte</button>
          <button data-act="mapmode" data-v="streets" role="tab">Rues</button>
        </div>
        <div id="map-filters" class="chips scroll-x"></div>
      </div>
      <div id="map-host">
        <div id="map"></div>
        <div class="map-fabs">
          <button class="fab-btn" data-act="map-layer" aria-label="Plan ou satellite"><svg class="ico" aria-hidden="true"><use href="#i-layers"></use></svg><span id="layer-lbl">Satellite</span></button>
          <button class="fab-btn" data-act="map-locate" aria-label="Me localiser"><svg class="ico" aria-hidden="true"><use href="#i-locate"></use></svg></button>
          <button class="fab-btn" data-act="map-fit" aria-label="Voir tout le village"><svg class="ico" aria-hidden="true"><use href="#i-expand"></use></svg></button>
          <button class="fab-btn" data-act="draw-start" aria-label="Dessiner un secteur"><svg class="ico" aria-hidden="true"><use href="#i-pen"></use></svg></button>
        </div>
        <div id="map-legend" class="map-legend"></div>
        <div id="draw-bar" class="draw-bar" hidden></div>
        <div id="route-bar" class="draw-bar" hidden></div>
      </div>
      <div id="streets-host" class="streets-host" hidden></div>
    </section>
    <section id="v-tour" class="view" aria-label="Tournée" hidden></section>
    <section id="v-rep" class="view" aria-label="Repasses" hidden></section>
    <section id="v-team" class="view" aria-label="Équipe" hidden></section>
  </main>

  <nav class="tabs" aria-label="Navigation">
    <button data-act="go" data-v="home"><svg class="ico" aria-hidden="true"><use href="#i-grid"></use></svg><span>Accueil</span></button>
    <button data-act="go" data-v="map"><svg class="ico" aria-hidden="true"><use href="#i-map"></use></svg><span>Carte</span></button>
    <button data-act="go" data-v="tour" class="fab"><b class="fab-disc"><svg class="ico" aria-hidden="true"><use href="#i-door"></use></svg></b><span>Tournée</span></button>
    <button data-act="go" data-v="rep"><svg class="ico" aria-hidden="true"><use href="#i-calclock"></use></svg><span>Repasses</span><b id="rep-badge" class="badge" hidden></b></button>
    <button data-act="go" data-v="team"><svg class="ico" aria-hidden="true"><use href="#i-users"></use></svg><span>Équipe</span></button>
  </nav>
</div>

<div id="sheet" class="sheet" hidden></div>
<div id="page" class="page" hidden></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<input id="import-file" type="file" accept="application/json,.json" hidden>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">

    <symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.8"/><path d="M2.5 20.5a6.5 6.5 0 0 1 13 0"/><path d="M15.5 4.4a3.8 3.8 0 0 1 0 7.2"/><path d="M21.5 20.5a6.5 6.5 0 0 0-3.6-5.8"/></symbol>

    <symbol id="i-repeat" viewBox="0 0 24 24"><path d="M3.5 12a8.5 8.5 0 0 1 14.7-5.8L20.5 8.5"/><path d="M20.5 3.5v5h-5"/><path d="M20.5 12a8.5 8.5 0 0 1-14.7 5.8L3.5 15.5"/><path d="M3.5 20.5v-5h5"/></symbol>
    <symbol id="i-todo" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" stroke-dasharray="3.2 3.2"/></symbol>
    <symbol id="i-gear" viewBox="0 0 24 24"><path d="M4 6.5h9M18 6.5h2M4 12h3M11 12h9M4 17.5h11M19 17.5h1"/><circle cx="15.5" cy="6.5" r="2.2"/><circle cx="8.5" cy="12" r="2.2"/><circle cx="17" cy="17.5" r="2.2"/></symbol>
    <symbol id="i-locate" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.5"/><circle cx="12" cy="12" r="7.5"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22"/></symbol>

    <symbol id="i-chev-l" viewBox="0 0 24 24"><path d="M15 5.5 8.5 12l6.5 6.5"/></symbol>

</svg>

<script src="vendor/leaflet.js"></script>
<script src="vendor/qrcode.js"></script>
<script src="config.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
